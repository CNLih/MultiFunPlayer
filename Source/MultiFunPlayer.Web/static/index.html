<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10171e">
  <link rel="manifest" href="../public/manifest.webmanifest">
  <title>MultiFunPlayer Control Room - static preview</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; --bg:#0e1419; --panel:#17232b; --line:#2b3a44; --text:#edf3f2; --muted:#94a6ac; --teal:#24c6b5; --amber:#f4b942; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:var(--bg); color:var(--text); } button { font:inherit; cursor:pointer; }
    .shell { min-height:100vh; display:grid; grid-template-columns:225px 1fr; } aside { padding:24px 16px; border-right:1px solid #23313a; background:#111920; } main { min-width:0; max-width:1400px; width:100%; padding:34px; margin:auto; }
    .brand { display:flex; align-items:center; gap:10px; padding:0 8px 26px; } .mark { display:grid; place-items:center; width:38px; height:38px; border:1px solid #2f8d86; border-radius:9px; color:var(--teal); font-weight:800; font-size:10px; } .brand small { display:block; color:var(--muted); margin-top:2px; }
    nav { display:grid; gap:4px; } nav button { padding:11px; border:1px solid transparent; border-radius:6px; background:transparent; color:var(--muted); text-align:left; } nav button.active { border-color:#285b59; background:#163f40; color:var(--text); } nav button:hover { border-color:var(--line); }
    header { display:flex; align-items:center; justify-content:space-between; min-height:67px; padding:0 34px; border-bottom:1px solid #23313a; background:#111920; color:var(--muted); } header strong { color:var(--text); } .demo { color:var(--teal); font-size:11px; }
    .heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:24px; } .eyebrow { color:var(--teal); text-transform:uppercase; letter-spacing:.1em; font-size:10px; font-weight:700; } h1 { margin:6px 0; font-size:32px; } h2 { margin:0 0 8px; font-size:18px; } p { color:var(--muted); }
    .button { padding:9px 13px; border:1px solid #2a9d91; border-radius:5px; background:var(--teal); color:#071917; font-weight:700; } .secondary { border-color:var(--line); background:var(--panel); color:var(--text); }
    .panel { margin-bottom:17px; padding:24px; border:1px solid #23313a; border-radius:8px; background:var(--panel); } .hero { display:flex; justify-content:space-between; min-height:230px; } .hero aside { width:235px; padding:0 0 0 24px; border:0; border-left:1px solid var(--line); background:transparent; } .hero h2 { font-size:27px; max-width:650px; margin-top:22px; } .meta { color:var(--muted); font-size:12px; } .track { max-width:640px; height:6px; margin-top:42px; border-radius:4px; background:#30404a; } .track span { display:block; width:52%; height:100%; border-radius:inherit; background:var(--teal); }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; } .metric { padding:17px; border:1px solid #23313a; border-radius:7px; background:#151e26; } .metric b { display:block; margin-top:9px; font-size:25px; } .metric small { color:var(--muted); }
    .columns { display:grid; grid-template-columns:1.35fr .65fr; gap:17px; } .row { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:57px; border-top:1px solid #23313a; } .row small { display:block; color:var(--muted); } .dot { display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:var(--teal); } .warn { background:var(--amber); } .logs .row { display:grid; grid-template-columns:65px 55px 1fr; justify-content:initial; font-size:11px; }
    @media(max-width:780px) { .shell { display:block; } aside { padding:12px; border-right:0; border-bottom:1px solid #23313a; } .brand { padding:0 4px 12px; } nav { display:flex; overflow:auto; } nav button { white-space:nowrap; } header { min-height:52px; padding:0 16px; } main { padding:24px 16px; } .heading { align-items:flex-start; flex-direction:column; } .hero { display:block; } .hero aside { width:auto; margin-top:25px; padding:20px 0 0; border-top:1px solid var(--line); border-left:0; } .metrics, .columns { grid-template-columns:1fr 1fr; } .columns { grid-template-columns:1fr; } }
    @media(max-width:480px) { .metrics { grid-template-columns:1fr 1fr; } h1 { font-size:25px; } .panel { padding:18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside><div class="brand"><div class="mark">MFP</div><div><strong>MultiFunPlayer</strong><small>Control room</small></div></div><nav aria-label="Primary navigation"><button class="active" data-view="runtime">Runtime</button><button data-view="media">Media sources</button><button data-view="scripts">Scripts</button><button data-view="outputs">Output targets</button><button data-view="logs">Logs and health</button></nav></aside>
    <div><header><span>Workspace / <strong id="crumb">Runtime</strong></span><span class="demo">* Local demo mode</span></header><main id="app" tabindex="-1"></main></div>
  </div>
  <script>
    const data = { sourcePlaying:true, route:'runtime', outputs:[['Studio bridge','TCP','Online'],['Living room relay','WebSocket','Warning'],['Bench simulator','UDP','Offline']], scripts:['Amber Protocol / Session 04','Orbit / Calibration sweep','Lumen / Quiet interval'] };
    const names = { runtime:'Runtime dashboard', media:'Media sources', scripts:'Scripts', outputs:'Output targets', logs:'Logs and health' };
    const dot = (status) => '<span class="dot '+(status==='Warning'?'warn':'')+'"></span>'+status;
    function render() {
      document.querySelector('#crumb').textContent = names[data.route];
      document.querySelectorAll('nav button').forEach((button) => button.classList.toggle('active', button.dataset.view === data.route));
      const app = document.querySelector('#app');
      if (data.route === 'runtime') app.innerHTML = '<div class="heading"><div><div class="eyebrow">Overview</div><h1>Runtime dashboard</h1><p>Manage routed sources, playback, connections, and output health.</p></div></div><section class="panel hero"><div><div class="eyebrow">Routed session</div><h2>Local media library</h2><div class="meta">Jellyfin &nbsp; - &nbsp; Studio bridge &nbsp; - &nbsp; Amber Protocol / Session 04</div><div class="track"><span></span></div><p class="meta">04:22 <span style="float:right">08:32</span></p><button class="button secondary" id="source-play">'+(data.sourcePlaying?'Pause source':'Play source')+'</button></div><aside><div class="meta">Route status</div><h1>1 <small>output</small></h1><span style="color:var(--teal)">Connected</span></aside></section><section class="metrics"><div class="metric">Routed sources<b>1 / 3</b><small>sources assigned</small></div><div class="metric">Output targets<b>1 / 3</b><small>targets streaming</small></div><div class="metric">Route latency<b>1.2 ms</b><small>median over 60 seconds</small></div><div class="metric">Events<b>5</b><small>recent entries</small></div></section><div class="columns"><section class="panel"><div class="eyebrow">Live connections</div><h2>Output health</h2>'+data.outputs.map((item) => '<div class="row"><div><strong>'+item[0]+'</strong><small>'+item[1]+' - 127.0.0.1</small></div><span>'+dot(item[2])+'</span></div>').join('')+'</section><section class="panel"><div class="eyebrow">System checks</div><h2>Health 3/4</h2><div class="row"><span>'+dot('Online')+' Runtime scheduler</span><small>1.2 ms median</small></div><div class="row"><span>'+dot('Online')+' Storage</span><small>48 GB free</small></div><div class="row"><span>'+dot('Warning')+' OFS relay</span><small>Negotiating</small></div></section></div>';
      else if (data.route === 'logs') app.innerHTML = '<div class="heading"><div><div class="eyebrow">Diagnostics</div><h1>Logs and health</h1><p>Inspect the event stream and checks protecting routed outputs.</p></div><button class="button secondary">Export snapshot</button></div><section class="panel"><div class="eyebrow">Overall status</div><h2><span class="dot"></span>Operational with one warning</h2><p>Last complete check at 09:47:22. The warning is isolated to the OFS relay.</p></section><section class="panel logs"><div class="eyebrow">Event stream</div><h2>Recent logs</h2><div class="row"><span>09:47:22</span><strong>info</strong><span>Local media library playback active</span></div><div class="row"><span>09:46:58</span><strong style="color:var(--amber)">warn</strong><span>Living room relay heartbeat delayed</span></div></section>';
      else { app.innerHTML = '<div class="heading"><div><div class="eyebrow">Workspace</div><h1>'+names[data.route]+'</h1><p>This static preview uses local mock state. Connect the API to configure real resources.</p></div><button class="button">Add '+(data.route === 'media' ? 'source' : data.route === 'outputs' ? 'target' : 'script')+'</button></div><section class="panel"><h2>'+names[data.route]+' ready</h2><p>Use the Vite app for the complete interactive prototype, or open this file directly in a browser.</p></section>'; }
      document.querySelector('#source-play')?.addEventListener('click', () => { data.sourcePlaying = !data.sourcePlaying; render(); });
    }
    document.querySelectorAll('nav button').forEach((button) => button.addEventListener('click', () => { data.route = button.dataset.view; render(); }));
    render();
  </script>
</body>
</html>
