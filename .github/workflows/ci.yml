name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force-build:
        description: 'Force build'
        required: false
        type: boolean
      force-docs:
        description: 'Force docs'
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.changes.outputs.source }}
      docs: ${{ steps.changes.outputs.docs }}
      packaging: ${{ steps.changes.outputs.packaging }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Detect changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          source:
            - 'Source/**'
            - 'MultiFunPlayer.sln'
            - 'tools/**'
            - '.github/workflows/**'
          docs:
            - 'Docs/**'
          packaging:
            - 'Dockerfile'
            - '.dockerignore'
            - 'deploy/**'
            - 'SECURITY.md'
            - 'deploy/validate-packaging.py'
            - 'deploy/validate-packaging.sh'
            - '.github/workflows/**'
  
  docs:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.docs == 'true') || (github.event.inputs.force-docs == 'true') }}
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 21
        cache: npm
        cache-dependency-path: ./Docs
    - name: Install dependencies
      run: npm ci
      working-directory: ./Docs
    - name: Audit production documentation dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: ./Docs
    - name: Record documentation toolchain audit
      run: npm audit --json > ../docs-audit.json || true
      working-directory: ./Docs
    - name: Build website
      run: npm run build
      working-directory: ./Docs
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./Docs/build
    - name: Upload documentation audit report
      uses: actions/upload-artifact@v4
      with:
        name: docs-dependency-audit
        path: ./docs-audit.json
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
  
  build:
    runs-on: windows-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.source == 'true') || (github.event.inputs.force-build == 'true') }}
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'
    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '5.x'
    - name: Determine version
      id:   gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
    - name: Install dependencies (locked)
      run: dotnet restore --locked-mode
    - name: Test ${{ matrix.build_type }}
      run: dotnet test --no-restore --configuration ${{ matrix.build_type }}
    - name: Build ${{ matrix.build_type }}
      run: dotnet publish --no-restore --configuration ${{ matrix.build_type }}
    - name: Upload ${{ matrix.build_type }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: MultiFunPlayer-${{ steps.gitversion.outputs.fullSemVer }}.${{ steps.gitversion.outputs.shortSha }}-${{ matrix.build_type }}
        path: Source\MultiFunPlayer\bin\${{ matrix.build_type }}\win-x64\publish

  portable:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.source == 'true') || (needs.detect-changes.outputs.docs == 'true') || (github.event.inputs.force-build == 'true') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./Source/MultiFunPlayer.Web/package-lock.json
    - name: Restore portable projects (locked)
      run: dotnet restore --locked-mode --disable-parallel -p:EnableWindowsTargeting=true
    - name: Test portable projects
      run: |
        dotnet test Source/MultiFunPlayer.Core.Tests/MultiFunPlayer.Core.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true
        dotnet test Source/MultiFunPlayer.Application.Tests/MultiFunPlayer.Application.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true
        dotnet test Source/MultiFunPlayer.Infrastructure.Tests/MultiFunPlayer.Infrastructure.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true
        dotnet test Source/MultiFunPlayer.Server.Tests/MultiFunPlayer.Server.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true -- xunit.parallelizeTestCollections=false
    - name: Audit .NET dependencies
      run: dotnet list MultiFunPlayer.sln package --vulnerable --include-transitive --no-restore
    - name: Build solution
      run: dotnet build MultiFunPlayer.sln --no-restore --configuration Release -p:EnableWindowsTargeting=true
    - name: Install Web dependencies
      run: npm ci --no-audit --no-fund
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Check Web contracts
      run: |
        npm run typecheck
        npm run check:static
        npm run build
        npm audit --omit=dev --audit-level=high
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Run Web browser smoke and screenshots
      run: npm run test:e2e
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Upload Web browser evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: web-playwright-evidence
        path: |
          Source/MultiFunPlayer.Web/playwright-report
          Source/MultiFunPlayer.Web/test-results
        if-no-files-found: ignore
    - name: Generate dependency SBOM
      run: python tools/generate-sbom.py --output artifacts/sbom/multifunplayer.cyclonedx.json
    - name: Generate license inventory
      run: python tools/generate-license-report.py --input artifacts/sbom/multifunplayer.cyclonedx.json --output artifacts/sbom/THIRD_PARTY_LICENSES.md
    - name: Upload dependency SBOM
      uses: actions/upload-artifact@v4
      with:
        name: dependency-sbom
        path: artifacts/sbom

  packaging:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.packaging == 'true') || (github.event.inputs.force-build == 'true') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate container and fnOS contracts
      run: ./deploy/validate-packaging.sh --json > packaging-contract.json
    - name: Upload packaging evidence
      uses: actions/upload-artifact@v4
      with:
        name: packaging-contract
        path: packaging-contract.json
