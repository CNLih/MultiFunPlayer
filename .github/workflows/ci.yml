name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force-build:
        description: 'Force build'
        required: false
        type: boolean
      force-docs:
        description: 'Force docs'
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.changes.outputs.source }}
      docs: ${{ steps.changes.outputs.docs }}
      packaging: ${{ steps.changes.outputs.packaging }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Detect changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          source:
            - 'Source/**'
            - 'MultiFunPlayer.sln'
            - 'tools/**'
            - '.github/workflows/**'
          docs:
            - 'Docs/**'
          packaging:
            - 'Dockerfile'
            - '.dockerignore'
            - 'deploy/**'
            - 'tools/generate-fpk-sbom.py'
            - 'tools/generate-license-report.py'
            - 'SECURITY.md'
            - 'deploy/validate-packaging.py'
            - 'deploy/validate-packaging.sh'
            - '.github/workflows/**'
  
  docs:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.docs == 'true') || (github.event.inputs.force-docs == 'true') }}
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./Docs
    - name: Install dependencies
      run: npm ci
      working-directory: ./Docs
    - name: Audit production documentation dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: ./Docs
    - name: Record documentation toolchain audit
      run: npm audit --audit-level=high --json > ../docs-audit.json
      working-directory: ./Docs
    - name: Build website
      run: npm run build
      working-directory: ./Docs
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./Docs/build
    - name: Upload documentation audit report
      uses: actions/upload-artifact@v4
      with:
        name: docs-dependency-audit
        path: ./docs-audit.json
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
  
  build:
    runs-on: windows-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.source == 'true') || (github.event.inputs.force-build == 'true') }}
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'
    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '5.x'
    - name: Determine version
      id:   gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
    - name: Install dependencies (locked)
      run: dotnet restore --locked-mode
    - name: Test ${{ matrix.build_type }}
      run: dotnet test --no-restore --configuration ${{ matrix.build_type }} -- xunit.parallelizeTestCollections=false
    - name: Smoke-test .NET 10 WPF XAML and plugin lifecycle
      if: ${{ matrix.build_type == 'Release' }}
      run: |
        dotnet test Source/MultiFunPlayer.Tests/MultiFunPlayer.Tests.csproj --no-restore --configuration Release --filter FullyQualifiedName~WpfXamlTests -- xunit.parallelizeTestCollections=false
        dotnet test Source/MultiFunPlayer.Tests/MultiFunPlayer.Tests.csproj --no-restore --configuration Release --filter FullyQualifiedName~PluginTests -- xunit.parallelizeTestCollections=false
    - name: Build ${{ matrix.build_type }}
      run: dotnet publish --no-restore --configuration ${{ matrix.build_type }}
    - name: Run framework-dependent Windows smoke
      if: ${{ matrix.build_type == 'Release' }}
      shell: pwsh
      run: >-
        ./tools/run-windows-framework-dependent-smoke.ps1
        -ExecutablePath
        Source/MultiFunPlayer/bin/${{ matrix.build_type }}/win-x64/publish/MultiFunPlayer.exe
    - name: Upload ${{ matrix.build_type }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: MultiFunPlayer-${{ steps.gitversion.outputs.fullSemVer }}.${{ steps.gitversion.outputs.shortSha }}-${{ matrix.build_type }}
        path: Source\MultiFunPlayer\bin\${{ matrix.build_type }}\win-x64\publish

  portable:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.source == 'true') || (needs.detect-changes.outputs.docs == 'true') || (github.event.inputs.force-build == 'true') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./Source/MultiFunPlayer.Web/package-lock.json
    - name: Restore portable projects (locked)
      run: dotnet restore --locked-mode --disable-parallel -p:EnableWindowsTargeting=true
    - name: Test portable projects
      run: |
        dotnet test Source/MultiFunPlayer.Core.Tests/MultiFunPlayer.Core.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true
        dotnet test Source/MultiFunPlayer.Application.Tests/MultiFunPlayer.Application.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true
        dotnet test Source/MultiFunPlayer.Infrastructure.Tests/MultiFunPlayer.Infrastructure.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true
        dotnet test Source/MultiFunPlayer.Server.Tests/MultiFunPlayer.Server.Tests.csproj --no-restore --configuration Release -p:EnableWindowsTargeting=true -- xunit.parallelizeTestCollections=false
    - name: Audit .NET dependencies
      run: dotnet list MultiFunPlayer.sln package --vulnerable --include-transitive --no-restore
    - name: Build solution
      run: dotnet build MultiFunPlayer.sln --no-restore --configuration Release -p:EnableWindowsTargeting=true
    - name: Run portable short soak smoke
      run: python tools/run-portable-soak.py --duration-seconds 10 --poll-seconds 0.5 --output artifacts/soak/portable-soak.json
    - name: Upload portable soak evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: portable-soak-evidence
        path: artifacts/soak
        if-no-files-found: ignore
    - name: Run portable upgrade rehearsal
      run: python tools/run-portable-upgrade.py --output artifacts/upgrade/portable-upgrade.json
    - name: Upload portable upgrade evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: portable-upgrade-evidence
        path: artifacts/upgrade
        if-no-files-found: ignore
    - name: Install Web dependencies
      run: npm ci --no-audit --no-fund
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Check Web contracts
      run: |
        npm run typecheck
        npm run check:static
        npm run build
        npm audit --omit=dev --audit-level=high
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Run Web browser smoke and screenshots
      run: npm run test:e2e
      working-directory: ./Source/MultiFunPlayer.Web
    - name: Upload Web browser evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: web-playwright-evidence
        path: |
          Source/MultiFunPlayer.Web/playwright-report
          Source/MultiFunPlayer.Web/test-results
        if-no-files-found: ignore
    - name: Install Docs dependencies for SBOM metadata
      run: npm ci --no-audit --no-fund
      working-directory: ./Docs
    - name: Test SBOM tooling
      run: python -m unittest discover -s tools/tests -v
    - name: Check portable dependency boundary
      run: python tools/check-portable-boundary.py --json
    - name: Validate release evidence template
      run: python tools/validate-release-evidence.py deploy/release-evidence.example.json --json
    - name: Generate dependency SBOM
      run: python tools/generate-sbom.py --output artifacts/sbom/multifunplayer.cyclonedx.json
    - name: Generate license inventory
      run: python tools/generate-license-report.py --input artifacts/sbom/multifunplayer.cyclonedx.json --output artifacts/sbom/THIRD_PARTY_LICENSES.md
    - name: Upload dependency SBOM
      uses: actions/upload-artifact@v4
      with:
        name: dependency-sbom
        path: artifacts/sbom
    - name: Run reproducible validation matrix
      run: python tools/run-validation-matrix.py --output artifacts/validation/validation-matrix.json
    - name: Upload validation matrix evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: validation-matrix-evidence
        path: artifacts/validation
        if-no-files-found: ignore

  packaging:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.packaging == 'true') || (github.event.inputs.force-build == 'true') }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate container and fnOS contracts
      run: ./deploy/validate-packaging.sh --json > packaging-contract.json
    - name: Download pinned official fnpack
      env:
        FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
        FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93
      run: |
        curl --fail --location --silent --show-error "$FNPACK_URL" --output fnpack
        echo "$FNPACK_SHA256  fnpack" | sha256sum --check
        chmod 0755 fnpack
    - name: Build fnOS x86 FPK
      run: FNPACK="$PWD/fnpack" ./deploy/fnos/build-fpk.sh --platform x86 --output-dir artifacts/fnos/x86
    - name: Build fnOS ARM FPK
      run: FNPACK="$PWD/fnpack" ./deploy/fnos/build-fpk.sh --platform arm --output-dir artifacts/fnos/arm
    - name: Verify fnOS FPK contents
      run: |
        ./deploy/validate-fpk.sh artifacts/fnos/x86/multifunplayer.fpk x86
        ./deploy/validate-fpk.sh artifacts/fnos/arm/multifunplayer.fpk arm
    - name: Generate FPK SBOM and license inventories
      run: |
        python tools/generate-fpk-sbom.py \
          --input artifacts/fnos/x86/multifunplayer.fpk \
          --output artifacts/fnos/x86/multifunplayer.fpk.cyclonedx.json
        python tools/generate-license-report.py \
          --input artifacts/fnos/x86/multifunplayer.fpk.cyclonedx.json \
          --output artifacts/fnos/x86/THIRD_PARTY_LICENSES.md
        python tools/generate-fpk-sbom.py \
          --input artifacts/fnos/arm/multifunplayer.fpk \
          --output artifacts/fnos/arm/multifunplayer.fpk.cyclonedx.json
        python tools/generate-license-report.py \
          --input artifacts/fnos/arm/multifunplayer.fpk.cyclonedx.json \
          --output artifacts/fnos/arm/THIRD_PARTY_LICENSES.md
    - name: Upload packaging evidence
      uses: actions/upload-artifact@v4
      with:
        name: packaging-contract
        path: |
          packaging-contract.json
          artifacts/fnos

  container:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: ${{ (needs.detect-changes.outputs.source == 'true') || (needs.detect-changes.outputs.docs == 'true') || (needs.detect-changes.outputs.packaging == 'true') || (github.event.inputs.force-build == 'true') }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build ${{ matrix.arch }} image
      run: docker buildx build --platform linux/${{ matrix.arch }} --tag multifunplayer:ci-${{ matrix.arch }} --load .
    - name: Verify loaded image architecture
      env:
        EXPECTED_ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        actual_arch="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "multifunplayer:ci-${{ matrix.arch }}")"
        test "$actual_arch" = "linux/$EXPECTED_ARCH"
    - name: Generate ${{ matrix.arch }} runtime CycloneDX SBOM
      uses: anchore/sbom-action@4a30bbadbe35d73a1729ee95a9196544192d905e
      with:
        image: multifunplayer:ci-${{ matrix.arch }}
        format: cyclonedx-json
        output-file: runtime-sbom-${{ matrix.arch }}.cyclonedx.json
        upload-artifact: false
    - name: Generate ${{ matrix.arch }} runtime license inventory
      run: |
        python tools/generate-license-report.py \
          --input runtime-sbom-${{ matrix.arch }}.cyclonedx.json \
          --output runtime-licenses-${{ matrix.arch }}.md
    - name: Upload ${{ matrix.arch }} runtime SBOM
      uses: actions/upload-artifact@v4
      with:
        name: runtime-sbom-${{ matrix.arch }}
        path: |
          runtime-sbom-${{ matrix.arch }}.cyclonedx.json
          runtime-licenses-${{ matrix.arch }}.md
    - name: Scan ${{ matrix.arch }} image for high and critical vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: multifunplayer:ci-${{ matrix.arch }}
        format: json
        output: trivy-${{ matrix.arch }}.json
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
        version: v0.73.0
    - name: Upload ${{ matrix.arch }} image scan evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-scan-${{ matrix.arch }}
        path: trivy-${{ matrix.arch }}.json
        if-no-files-found: ignore
    - name: Smoke test ${{ matrix.arch }} image
      env:
        IMAGE_TAG: multifunplayer:ci-${{ matrix.arch }}
        CONTAINER_NAME: mfp-ci-${{ matrix.arch }}
        MFP_TEST_TOKEN: ci-test-token-1234567890
      run: |
        set -euo pipefail
        trap 'docker logs "$CONTAINER_NAME" || true; docker rm -f "$CONTAINER_NAME" || true' EXIT
        docker run --detach --name "$CONTAINER_NAME" \
          --publish 18080:8080 \
          --read-only \
          --tmpfs /config \
          --tmpfs /keys \
          --tmpfs /scripts \
          --tmpfs /logs \
          --tmpfs /tmp \
          --env MFP_AUTH_TOKEN="$MFP_TEST_TOKEN" \
          "$IMAGE_TAG"
        for attempt in $(seq 1 60); do
          if curl --fail --silent --show-error http://127.0.0.1:18080/health/live >/dev/null; then
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $MFP_TEST_TOKEN" \
              http://127.0.0.1:18080/api/v1/adapters >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q "MultiFunPlayer"
            exit 0
          fi
          if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
            docker logs "$CONTAINER_NAME"
            exit 1
          fi
          sleep 2
        done
        docker logs "$CONTAINER_NAME"
        exit 1
