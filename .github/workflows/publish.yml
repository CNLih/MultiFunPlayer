name: Publish

on:
  push:
    tags:
      - '*'
      
permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Verify release evidence
      run: |
        test -f deploy/release-evidence.json
        python tools/validate-release-evidence.py deploy/release-evidence.json --require-complete
    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'
    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '5.x'
    - name: Run GitVersion
      id:   gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
    - name: Install Dependencies (locked)
      run: dotnet restore --locked-mode
    - name: Test
      run: dotnet test --no-restore --configuration Release -- xunit.parallelizeTestCollections=false
    - name: Build Framework Dependent
      run: dotnet publish --no-restore --self-contained false --configuration Release --property:PublishDir=.\bin\Release\win-x64\publish\framework-dependent
    - name: Run framework-dependent Windows smoke
      shell: pwsh
      run: >-
        ./tools/run-windows-framework-dependent-smoke.ps1
        -ExecutablePath
        Source/MultiFunPlayer/bin/Release/win-x64/publish/framework-dependent/MultiFunPlayer.exe
    - name: Build Self Contained
      run: dotnet publish --no-restore --self-contained true --configuration Release --property:PublishDir=.\bin\Release\win-x64\publish\self-contained
    - name: Setup NetBeauty
      run: dotnet tool install --global nulastudio.nbeauty
    - name: Run NetBeauty
      run: nbeauty2.exe .\Source\MultiFunPlayer\bin\Release\win-x64\publish\self-contained\ Bin
    - name: Pack Framework Dependent
      run: 7z a MultiFunPlayer-${{ steps.gitversion.outputs.semVer }}.zip .\Source\MultiFunPlayer\bin\Release\win-x64\publish\framework-dependent\*
    - name: Pack Self Contained
      run: 7z a MultiFunPlayer-${{ steps.gitversion.outputs.semVer }}-SelfContained.$(dotnet --version).zip .\Source\MultiFunPlayer\bin\Release\win-x64\publish\self-contained\*
    - name: Create Release
      id: create-release
      uses: ncipollo/release-action@v1
      with:
        draft: false
        prerelease: false
        artifactErrorsFailBuild: true
        name: MultiFunPlayer v${{ steps.gitversion.outputs.semVer }}
        artifacts: MultiFunPlayer-${{ steps.gitversion.outputs.semVer }}*.zip
